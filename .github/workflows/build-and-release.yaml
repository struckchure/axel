name: Build and Release

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
  push:
    # Tag pushes always run and publish a release. Path filters are ignored for
    # tag pushes, so a tag on a docs/branding commit still releases.
    tags:
      - v*
    # Main pushes run the test gate and a snapshot build (but do not release).
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run test suite
        run: go test -v ./...

  release:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Release (tag push)
        if: github.ref_type == 'tag'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build check (branch push)
        if: github.ref_type != 'tag'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
